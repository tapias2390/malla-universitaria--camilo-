<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transición de Mallas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icono.png">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<section id="vistaLogin" class="escena oculto">

  <!-- Paisaje de fondo: colinas, árboles, plantas y nubes (SVG propio) -->
  <svg class="fondo" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <g fill="#fff">
      <g class="nube" opacity=".9"><ellipse cx="190" cy="150" rx="70" ry="26"/><ellipse cx="240" cy="132" rx="46" ry="32"/><ellipse cx="150" cy="140" rx="34" ry="22"/></g>
      <g class="nube n2" opacity=".75"><ellipse cx="760" cy="96" rx="80" ry="24"/><ellipse cx="808" cy="80" rx="44" ry="28"/></g>
      <g class="nube n3" opacity=".85"><ellipse cx="1230" cy="210" rx="74" ry="24"/><ellipse cx="1190" cy="196" rx="40" ry="26"/><ellipse cx="1262" cy="192" rx="36" ry="22"/></g>
      <g class="nube" opacity=".6"><ellipse cx="520" cy="300" rx="56" ry="18"/><ellipse cx="548" cy="288" rx="30" ry="18"/></g>
    </g>
    <path d="M0 700 Q200 630 430 690 T900 680 T1440 660 V900 H0Z" fill="#bfe2ea"/>
    <path d="M0 760 Q360 720 760 752 T1440 740 V900 H0Z" fill="#a9d7e2" opacity=".55"/>
    <path d="M0 800 Q720 760 1440 800 V900 H0Z" fill="#eaf6fb"/>

    <!-- Árboles -->
    <g class="arbol"><line x1="610" y1="810" x2="610" y2="700" stroke="#1b7f95" stroke-width="4"/><path d="M610 600 C646 640 648 726 610 770 C572 726 574 640 610 600Z" fill="#2aa6bd"/><path d="M610 620 V760" stroke="#1b7f95" stroke-width="2"/></g>
    <g class="arbol a2"><line x1="660" y1="812" x2="660" y2="750" stroke="#1b7f95" stroke-width="3"/><path d="M660 690 C682 714 684 762 660 790 C636 762 638 714 660 690Z" fill="#53bfd1"/></g>
    <g class="arbol a3"><line x1="1300" y1="806" x2="1300" y2="680" stroke="#1b7f95" stroke-width="4"/><path d="M1300 560 C1342 606 1344 708 1300 760 C1256 708 1258 606 1300 560Z" fill="#2aa6bd"/><path d="M1300 584 V748" stroke="#1b7f95" stroke-width="2"/></g>
    <g class="arbol"><line x1="1360" y1="808" x2="1360" y2="740" stroke="#1b7f95" stroke-width="3"/><path d="M1360 670 C1386 698 1388 754 1360 786 C1332 754 1334 698 1360 670Z" fill="#53bfd1"/></g>

    <!-- Hojas grandes -->
    <g class="hoja"><path d="M1040 820 C990 760 1000 690 1060 660 C1090 720 1080 780 1040 820Z" fill="#1b7f95"/><path d="M1040 820 C1036 760 1046 710 1060 664" stroke="#9fdbe6" stroke-width="2" fill="none"/></g>
    <g class="hoja h2"><path d="M1060 824 C1120 790 1170 740 1150 680 C1090 700 1060 760 1060 824Z" fill="#2aa6bd"/><path d="M1060 824 C1090 770 1120 720 1148 684" stroke="#bde8ef" stroke-width="2" fill="none"/></g>

    <!-- Matera con flores -->
    <g class="hoja h2">
      <path d="M190 840 C186 790 170 760 150 740 M200 840 C204 780 230 750 250 734 M196 840 C196 800 196 770 200 730" stroke="#3b2d91" stroke-width="3" fill="none"/>
      <ellipse cx="160" cy="764" rx="16" ry="7" fill="#3b2d91" transform="rotate(-35 160 764)"/>
      <ellipse cx="236" cy="760" rx="16" ry="7" fill="#3b2d91" transform="rotate(30 236 760)"/>
      <ellipse cx="182" cy="790" rx="14" ry="6" fill="#4b3ca8" transform="rotate(-20 182 790)"/>
      <circle cx="150" cy="738" r="9" fill="#fff"/><circle cx="150" cy="738" r="3" fill="#f4c34d"/>
      <circle cx="250" cy="732" r="9" fill="#fff"/><circle cx="250" cy="732" r="3" fill="#f4c34d"/>
      <circle cx="200" cy="726" r="8" fill="#fff"/><circle cx="200" cy="726" r="3" fill="#f4c34d"/>
    </g>
    <path d="M166 832 H226 L218 880 C216 888 176 888 174 880Z" fill="#2c2072"/>
  </svg>

  <!-- Burbuja de chat flotante -->
  <div class="burbuja" aria-hidden="true">
    <svg viewBox="0 0 92 64"><path d="M10 4 H82 A8 8 0 0 1 90 12 V40 A8 8 0 0 1 82 48 H34 L20 60 L22 48 H10 A8 8 0 0 1 2 40 V12 A8 8 0 0 1 10 4Z" fill="#a8dcf2"/><rect x="16" y="17" width="58" height="6" rx="3" fill="#fff"/><rect x="16" y="29" width="38" height="6" rx="3" fill="#fff"/></svg>
  </div>

  <!-- Persona con laptop -->
  <svg class="persona" viewBox="0 0 300 560" aria-hidden="true">
    <ellipse cx="160" cy="540" rx="96" ry="10" fill="#2c2072" opacity=".12"/>
    <!-- pantalón ancho -->
    <path d="M118 250 H204 L232 522 H182 L162 330 L146 524 H94Z" fill="#3b2d91"/>
    <path d="M162 330 L160 260" stroke="#2c2072" stroke-width="2"/>
    <ellipse cx="118" cy="528" rx="28" ry="9" fill="#21185c"/>
    <ellipse cx="210" cy="526" rx="28" ry="9" fill="#21185c"/>
    <!-- brazo derecho a la cintura -->
    <path d="M198 162 Q232 196 226 222 Q220 240 204 246" stroke="#2a8fd6" stroke-width="22" stroke-linecap="round" fill="none"/>
    <circle cx="204" cy="246" r="9" fill="#f2b9a1"/>
    <!-- torso -->
    <path d="M120 156 Q160 138 200 156 L210 258 H112Z" fill="#2f9ae0"/>
    <path d="M146 146 Q160 160 174 146" stroke="#1f7cc0" stroke-width="3" fill="none"/>
    <!-- cuello y cabeza -->
    <rect x="151" y="120" width="18" height="28" rx="6" fill="#f2b9a1"/>
    <ellipse cx="161" cy="100" rx="23" ry="27" fill="#f2b9a1"/>
    <path d="M138 106 Q132 70 161 70 Q192 70 186 104 Q184 90 172 86 Q156 84 146 96 Q140 104 138 116Z" fill="#2a2152"/>
    <circle cx="178" cy="62" r="14" fill="#2a2152"/>
    <path d="M184 100 Q192 122 182 134" stroke="#2a2152" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- laptop -->
    <path d="M14 168 L96 150 L106 226 L24 246Z" fill="#8fb4e3"/>
    <path class="pantalla" d="M22 176 L90 161 L98 220 L30 236Z" fill="#cfe3fa"/>
    <path d="M52 194 C58 186 66 188 66 196 C66 204 58 210 56 212 C54 210 48 204 52 194Z" fill="#8fb4e3"/>
    <path d="M24 246 L106 226 L118 234 L34 256Z" fill="#6f95c8"/>
    <!-- brazo izquierdo sosteniendo la laptop -->
    <path d="M124 164 Q98 196 100 222 L70 236" stroke="#2a8fd6" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <ellipse cx="66" cy="236" rx="10" ry="8" fill="#f2b9a1"/>
  </svg>

  <!-- Tarjeta de acceso -->
  <div class="tarjeta" id="tarjetaLogin">
    <h2>Bienvenido de nuevo</h2>
    <p class="intro">Consulta tu avance en la malla vigente de Ingeniería Química.</p>
    <form id="formLogin" novalidate>
      <div class="campo">
        <input id="usuario" autocomplete="username" placeholder=" " required>
        <label for="usuario">Usuario</label>
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      </div>
      <div class="campo">
        <input id="clave" type="password" autocomplete="current-password" placeholder=" " required>
        <label for="clave">Contraseña</label>
        <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg>
        <button type="button" class="ver-clave" id="verClave" aria-label="Mostrar contraseña" aria-pressed="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/><path class="tachado" d="M4 20 20 4"/></svg>
        </button>
      </div>
      <div>
        <div class="opciones">
          <label class="recordar"><input type="checkbox" id="recordar"> Recordar usuario</label>
          <button type="button" class="enlace" id="olvide" aria-controls="ayudaClave" aria-expanded="false">¿Olvidaste tu contraseña?</button>
        </div>
        <div class="ayuda" id="ayudaClave"><p>Pídele al administrador del programa que te asigne una contraseña nueva.</p></div>
      </div>
      <div>
        <button type="submit" class="btn-entrar" id="btnEntrar"><span class="giro" aria-hidden="true"></span><span id="txtEntrar">Iniciar sesión</span></button>
        <div id="errorLogin" class="error" role="alert"></div>
      </div>
    </form>
  </div>
</section>


<!-- ============ APLICACIÓN ============ -->
<div id="vistaApp" class="app oculto">
  <aside class="menu" id="menu">
    <div class="marca">
      <div class="logo">IQ</div>
      <div><b>Transición de mallas</b><small>Ingeniería Química</small></div>
    </div>
    <nav id="navegacion" aria-label="Menú principal"></nav>
    <div class="perfil">
      <b id="perfilNombre"></b><span id="perfilRol"></span>
      <button class="sec" id="btnSalir" type="button">Cerrar sesión</button>
    </div>
  </aside>
  <div>
    <div class="barra-movil">
      <button type="button" id="btnMenu" aria-label="Abrir menú">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <b>Transición de mallas</b>
    </div>
    <main class="contenido" id="contenido" tabindex="-1"></main>
  </div>
</div>

<dialog id="modal">
  <form method="dialog" id="modalForm" novalidate>
    <div class="cabecera"><h2 id="modalTitulo"></h2><button type="button" class="icono" id="modalCerrar" aria-label="Cerrar">✕</button></div>
    <div class="cuerpo" id="modalCuerpo"></div>
    <div class="pie">
      <button type="button" class="sec" id="modalCancelar">Cancelar</button>
      <button type="submit" id="modalAceptar">Guardar</button>
    </div>
  </form>
</dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
